<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>カメラ背景・10枚イラストスライドショー</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #000;
    }
    /* スマホのカメラ映像を背景に全画面表示 */
    #camera-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }
    /* イラストを表示するコンテナ */
    #slide-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      touch-action: none; /* ブラウザ独自のズームやスクロールを無効化 */
    }
    /* イラスト画像 */
    #slide-img {
      max-width: 85vw;
      max-height: 85vh;
      object-fit: contain;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
    }
    /* 状態表示オーバーレイ */
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
  </style>
</head>
<body>

  <!-- 操作ガイドの表示 -->
  <div id="info-overlay">
    <div>状態: <span id="status">カメラ起動中...</span></div>
    <div style="margin-top: 4px; font-size: 10px; color: #aaa;">画面タップ: 切替(1/10) / ピンチ: 拡大縮小 / ドラッグ: 移動</div>
  </div>

  <!-- カメラ映像（背景） -->
  <video id="camera-video" autoplay playsinline muted></video>

  <!-- イラストスライドショー -->
  <div id="slide-container">
    <img id="slide-img" src="1.jpg" alt="イラスト">
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('camera-video');
    const slideImg = document.getElementById('slide-img');
    const container = document.getElementById('slide-container');

    // 10枚の画像ファイル名のリスト
    const images = [
      '1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg',
      '6.jpg', '7.jpg', '8.jpg', '9.jpg', '10.jpg'
    ];
    let currentIndex = 0;

    // 1. スマホのバックカメラを起動する処理
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, // 外側カメラを指定
          audio: false
        });
        videoEl.srcObject = stream;
        statusEl.textContent = `カメラ起動成功！ (1 / ${images.length}枚目)`;
        statusEl.className = 'success';
      } catch (err) {
        console.error(err);
        statusEl.textContent = "エラー: カメラの権限が拒否されたか利用できません";
        statusEl.className = 'error';
      }
    }
    startCamera();

    // 2. タップ切替 ＆ 2本指ピンチ拡大縮小 ＆ ドラッグ移動の変数
    let scale = 1;
    let posX = 0;
    let posY = 0;
    
    let startX = 0;
    let startY = 0;
    let initialDistance = null;
    let initialScale = 1;
    let isDragging = false;
    let touchStartTime = 0;
    let hasMoved = false;

    // タッチ開始
    container.addEventListener('touchstart', (e) => {
      touchStartTime = Date.now();
      hasMoved = false;

      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - posX;
        startY = e.touches[0].clientY - posY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = scale;
      }
    }, { passive: false });

    // タッチ中（移動・ピンチ）
    container.addEventListener('touchmove', (e) => {
      e.preventDefault(); // 画面のスクロールやズームを防止
      hasMoved = true;

      if (e.touches.length === 1 && isDragging) {
        // 1本指ドラッグで位置を動かす
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        // 2本指ピンチで拡大縮小
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        scale = Math.max(0.2, Math.min(5.0, initialScale * factor));
        updateTransform();
      }
    }, { passive: false });

    // タッチ終了
    container.addEventListener('touchend', (e) => {
      // 動かしていない状態で素早く（0.3秒未満）タップされた場合は画像を次へ進める（ループ）
      if (!hasMoved && (Date.now() - touchStartTime < 300)) {
        currentIndex = (currentIndex + 1) % images.length;
        slideImg.src = images[currentIndex];
        statusEl.textContent = `表示中 (${currentIndex + 1} / ${images.length}枚目)`;
      }

      if (e.touches.length === 0) {
        isDragging = false;
        initialDistance = null;
      }
    });

    // 画面に反映させる関数
    function updateTransform() {
      slideImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }
  </script>
</body>
</html>
